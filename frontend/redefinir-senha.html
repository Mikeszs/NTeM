<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSocial | Redefinir Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg-app: #f4f7f6;
            --bg-surface: #ffffff;
            --text-primary: #333333;
            --text-secondary: #6c757d;
            --border-color: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --input-border: #ced4da;
        }
        [data-theme="dark"] {
            --bg-app: #12181b;
            --bg-surface: #1b2327;
            --text-primary: #e8eaed;
            --text-secondary: #9aa4a8;
            --border-color: rgba(255,255,255,0.08);
            --input-bg: #222c30;
            --input-border: #384347;
        }
        body {
            background-color: var(--bg-app);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color .25s ease;
        }
        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: var(--bg-surface);
            color: var(--text-primary);
            transition: background-color .25s ease, color .25s ease;
        }
        .btn-success { background-color: #2cba92; border: none; }
        .btn-success:hover { background-color: #249e7c; }
        .form-control {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
        }
        .form-control:focus { background-color: var(--input-bg); color: var(--text-primary); }
    </style>
</head>
<body>

    <div class="card-login">

        <div class="text-center mb-4">
            <h3 class="fw-bold text-success"><i class="fa-solid fa-leaf me-2"></i>NutriSocial</h3>
            <p class="text-muted" id="subtitulo">Defina sua nova senha</p>
        </div>

        <!-- Estado: sem token na URL -->
        <div id="visaoSemToken" style="display:none;" class="text-center">
            <i class="fas fa-exclamation-triangle text-warning fs-1 mb-3"></i>
            <p>Link inválido ou incompleto. Solicite uma nova redefinição a partir da tela de login.</p>
            <a href="login.html" class="btn btn-outline-success rounded-pill px-4 mt-2">Voltar ao Login</a>
        </div>

        <!-- Estado: formulário de nova senha -->
        <form id="formRedefinir" style="display:none;">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nova senha</label>
                <input type="password" id="novaSenha" class="form-control" minlength="6" required>
                <small class="text-muted">Mínimo de 6 caracteres.</small>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Confirmar nova senha</label>
                <input type="password" id="confirmarSenha" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill" id="btnRedefinir">
                Redefinir Senha
            </button>
        </form>

        <!-- Estado: sucesso -->
        <div id="visaoSucesso" style="display:none;" class="text-center">
            <i class="fas fa-check-circle text-success fs-1 mb-3"></i>
            <p>Senha redefinida com sucesso!</p>
            <a href="login.html" class="btn btn-success rounded-pill px-4 mt-2 w-100">Ir para o Login</a>
        </div>

        <!-- Estado: erro (token inválido/expirado) -->
        <div id="visaoErro" style="display:none;" class="text-center">
            <i class="fas fa-times-circle text-danger fs-1 mb-3"></i>
            <p id="mensagemErro">Não foi possível redefinir sua senha.</p>
            <a href="login.html" class="btn btn-outline-success rounded-pill px-4 mt-2">Solicitar novo link</a>
        </div>

    </div>

    <script src="config.js"></script>
    <script>
        // ── Extrai o token da URL (?token=...) ──
        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token');

        const formRedefinir   = document.getElementById('formRedefinir');
        const visaoSemToken   = document.getElementById('visaoSemToken');
        const visaoSucesso    = document.getElementById('visaoSucesso');
        const visaoErro       = document.getElementById('visaoErro');
        const subtitulo       = document.getElementById('subtitulo');

        if (!token) {
            subtitulo.style.display = 'none';
            visaoSemToken.style.display = 'block';
        } else {
            formRedefinir.style.display = 'block';
        }

        formRedefinir.addEventListener('submit', async function(e) {
            e.preventDefault();

            const nova      = document.getElementById('novaSenha').value;
            const confirmar = document.getElementById('confirmarSenha').value;

            if (nova !== confirmar) {
                return alert("❌ As senhas não coincidem.");
            }

            const btn = document.getElementById('btnRedefinir');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redefinindo...';
            btn.disabled = true;

            try {
                const resposta = await fetch(`${API_BASE}/auth/redefinir-senha`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, senha_nova: nova })
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    formRedefinir.style.display = 'none';
                    subtitulo.style.display = 'none';
                    visaoSucesso.style.display = 'block';
                } else {
                    formRedefinir.style.display = 'none';
                    subtitulo.style.display = 'none';
                    document.getElementById('mensagemErro').textContent =
                        resultado.detail || "Link inválido ou expirado. Solicite uma nova redefinição.";
                    visaoErro.style.display = 'block';
                }
            } catch (erro) {
                alert("⚠️ Erro de conexão com o servidor. Tente novamente em instantes.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
