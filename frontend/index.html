<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT&M | Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>

    <div class="d-flex" id="wrapper">
        
        <aside id="sidebar-wrapper" class="bg-white shadow-sm d-flex flex-column" style="min-height: 100vh;">
            <div class="sidebar-heading text-center py-4 border-bottom">
                <i class="fa-solid fa-leaf fs-3 me-2 logo-icon"></i>
                <span class="fs-4 fw-bold logo-text">NT&M</span>
            </div>
            
            <div class="list-group list-group-flush my-3 flex-grow-1">
                <a href="index.html" class="list-group-item list-group-item-action active"><i class="fas fa-chart-line me-3"></i>Dashboard</a>
                <a href="cadastro.html" class="list-group-item list-group-item-action"><i class="fas fa-user-plus me-3"></i>Cadastro & Anamnese</a>
                <a href="antropometria.html" class="list-group-item list-group-item-action"><i class="fas fa-weight me-3"></i>Antropometria</a>
                <a href="dieta.html" class="list-group-item list-group-item-action"><i class="fas fa-apple-alt me-3"></i>Plano Alimentar</a>
            </div>

            <div class="list-group list-group-flush mb-4 mt-auto">
                <a href="perfil.html" class="list-group-item list-group-item-action"><i class="fas fa-user-cog me-3"></i>Meu Perfil</a>
                <a href="#" id="btnSair" class="list-group-item list-group-item-action text-danger fw-bold">
                    <i class="fas fa-sign-out-alt me-3"></i>Sair do Sistema
                </a>
            </div>
        </aside>

        <main id="page-content-wrapper">
            
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3" id="menu-toggle" role="button" aria-label="Alternar Menu"></i>
                    <h2 class="fs-3 m-0 fw-bold title-text">Visão Geral</h2>
                </div>
                
                <div class="ms-auto d-flex align-items-center gap-3">
                    <span id="nomeUsuario" class="me-1 fw-semibold text-muted d-none d-md-block">Carregando...</span>
                    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="perfil.html" class="text-decoration-none" title="Meu Perfil">
                        <i class="fas fa-user-circle fs-2 text-success"></i>
                    </a>
                </div>
            </nav>

            <section class="container-fluid px-4 py-3">
                <div class="row g-4">
                    <!-- Pacientes Ativos -->
                    <div class="col-12 col-md-4">
                        <div class="card card-custom p-3 border-0 shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="text-muted mb-1 fw-semibold">Pacientes Ativos</p>
                                    <h3 class="fs-1 fw-bold mb-0" id="totalPacientes">
                                        <i class="fas fa-spinner fa-spin fs-4 text-success"></i>
                                    </h3>
                                </div>
                                <div class="icon-box bg-success bg-opacity-10 text-success rounded p-3">
                                    <i class="fas fa-users fs-3"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Planos Alimentares com dieta elaborada -->
                    <div class="col-12 col-md-4">
                        <div class="card card-custom p-3 border-0 shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="text-muted mb-1 fw-semibold">Com Plano Elaborado</p>
                                    <h3 class="fs-1 fw-bold mb-0" id="totalComDieta">
                                        <i class="fas fa-spinner fa-spin fs-4 text-success"></i>
                                    </h3>
                                </div>
                                <div class="icon-box bg-success bg-opacity-10 text-success rounded p-3">
                                    <i class="fas fa-apple-alt fs-3"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pendentes (cadastrados mas sem dieta ainda) -->
                    <div class="col-12 col-md-4">
                        <div class="card card-custom p-3 border-0 shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="text-muted mb-1 fw-semibold">Aguardando Plano</p>
                                    <h3 class="fs-1 fw-bold mb-0" id="totalSemDieta">
                                        <i class="fas fa-spinner fa-spin fs-4 text-warning"></i>
                                    </h3>
                                </div>
                                <div class="icon-box bg-warning bg-opacity-10 text-warning rounded p-3">
                                    <i class="fas fa-hourglass-half fs-3"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Últimos Pacientes Cadastrados + Distribuição por Objetivo -->
                <div class="row mt-4 g-4">
                    <div class="col-12 col-lg-8">
                        <div class="card card-custom border-0 p-4 shadow-sm h-100">
                            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                                <h4 class="fs-5 fw-bold mb-0">Últimos Pacientes Cadastrados</h4>
                                <a href="cadastro.html" class="btn btn-sm btn-outline-success rounded-pill">Ver todos</a>
                            </div>
                            <div id="listaRecentes">
                                <p class="text-muted py-3"><i class="fas fa-spinner fa-spin me-2"></i>Buscando prontuários...</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-4">
                        <div class="card card-custom border-0 p-4 shadow-sm h-100">
                            <h4 class="fs-5 fw-bold mb-3">Distribuição por Objetivo</h4>
                            <div id="listaObjetivos">
                                <p class="text-muted py-3"><i class="fas fa-spinner fa-spin me-2"></i>Calculando...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    
    <script>
        // Guarda de rota de segurança
        auth.exigir('profissional');

        document.addEventListener("DOMContentLoaded", async function() {
            // 1. Controle do Menu Lateral
            const el = document.getElementById("wrapper");
            const toggleButton = document.getElementById("menu-toggle");
            toggleButton.addEventListener("click", () => el.classList.toggle("toggled"));

            // 2. Personalização do Cabeçalho
            const nomeProfissional = auth.nome();
            document.getElementById('nomeUsuario').textContent = nomeProfissional ? `Olá, ${nomeProfissional}` : 'Área do Profissional';

            // Paleta usada para os badges de objetivo, ciclando conforme a quantidade
            const CORES_OBJETIVO = ['success', 'primary', 'warning', 'info', 'danger', 'secondary'];

            // 3. Consumo da API para Métricas (pacientes + resumo agregado em paralelo)
            try {
                const [respPacientes, respResumo] = await Promise.all([
                    fetch(`${API_BASE}/pacientes/`,       { headers: { "Authorization": `Bearer ${auth.token()}` } }),
                    fetch(`${API_BASE}/dashboard/resumo`, { headers: { "Authorization": `Bearer ${auth.token()}` } }),
                ]);

                if (respPacientes.status === 401 || respResumo.status === 401) {
                    auth.limpar();
                    window.location.href = "login.html";
                    return;
                }
                if (!respPacientes.ok || !respResumo.ok) throw new Error("Falha de conexão com a API");

                const pacientes = await respPacientes.json();
                const resumo    = await respResumo.json();

                // Cards de métricas
                document.getElementById('totalPacientes').textContent = resumo.total_pacientes;
                document.getElementById('totalComDieta').textContent  = resumo.pacientes_com_dieta;
                document.getElementById('totalSemDieta').textContent  = resumo.pacientes_sem_dieta;

                // Últimos pacientes cadastrados
                const recentes = pacientes.slice(-4).reverse();
                const containerRecentes = document.getElementById('listaRecentes');

                if (recentes.length > 0) {
                    let html = '<div class="list-group list-group-flush">';
                    recentes.forEach(p => {
                        html += `
                            <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-light">
                                <div class="d-flex align-items-center">
                                    <div class="bg-success bg-opacity-10 rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 45px; height: 45px;">
                                        <i class="fas fa-user text-success"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0 fw-bold">${p.nome}</h6>
                                        <small class="text-muted">${p.idade ? p.idade + ' anos' : 'Idade não informada'}</small>
                                    </div>
                                </div>
                                <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">
                                    ${p.objetivo || 'Avaliação Inicial'}
                                </span>
                            </div>
                        `;
                    });
                    html += '</div>';
                    containerRecentes.innerHTML = html;
                } else {
                    containerRecentes.innerHTML = '<div class="alert alert-light text-center text-muted my-3">Nenhum paciente cadastrado na base de dados.</div>';
                }

                // Distribuição por objetivo — barras de progresso simples
                const containerObjetivos = document.getElementById('listaObjetivos');
                if (resumo.distribuicao_objetivos.length > 0) {
                    const maiorTotal = Math.max(...resumo.distribuicao_objetivos.map(o => o.total));
                    let html = '';
                    resumo.distribuicao_objetivos
                        .sort((a, b) => b.total - a.total)
                        .forEach((item, i) => {
                            const cor = CORES_OBJETIVO[i % CORES_OBJETIVO.length];
                            const pct = Math.round((item.total / maiorTotal) * 100);
                            html += `
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between mb-1">
                                        <small class="fw-semibold">${item.objetivo}</small>
                                        <small class="text-muted">${item.total}</small>
                                    </div>
                                    <div class="progress" style="height: 8px; border-radius: 4px;">
                                        <div class="progress-bar bg-${cor}" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        });
                    containerObjetivos.innerHTML = html;
                } else {
                    containerObjetivos.innerHTML = '<p class="text-muted small">Sem dados suficientes ainda.</p>';
                }

            } catch (erro) {
                console.error(erro);
                document.getElementById('totalPacientes').textContent = "-";
                document.getElementById('totalComDieta').textContent  = "-";
                document.getElementById('totalSemDieta').textContent  = "-";
                document.getElementById('listaRecentes').innerHTML = '<div class="alert alert-danger my-3">Falha ao carregar os dados. Verifique a conexão com o servidor.</div>';
                document.getElementById('listaObjetivos').innerHTML = '<p class="text-muted small">Indisponível no momento.</p>';
            }
        });

        // ==========================================
        // FUNÇÃO DE LOGOUT
        // ==========================================
        document.getElementById('btnSair').addEventListener('click', function(e) {
            e.preventDefault();
            if(confirm("Deseja realmente sair do sistema?")) {
                auth.limpar();
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
