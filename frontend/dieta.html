<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSocial | Plano Alimentar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
      
        <aside id="sidebar-wrapper" class="bg-white shadow-sm d-flex flex-column" style="min-height: 100vh;">
            <div class="sidebar-heading text-center py-4 border-bottom">
                <i class="fa-solid fa-leaf fs-3 me-2 logo-icon"></i>
                <span class="fs-4 fw-bold logo-text">NutriSocial</span>
            </div>
            
            <div class="list-group list-group-flush my-3 flex-grow-1">
                <a href="index.html" class="list-group-item list-group-item-action"><i class="fas fa-chart-line me-3"></i>Dashboard</a>
                <a href="cadastro.html" class="list-group-item list-group-item-action"><i class="fas fa-user-plus me-3"></i>Cadastro & Anamnese</a>
                <a href="antropometria.html" class="list-group-item list-group-item-action"><i class="fas fa-weight me-3"></i>Antropometria</a>
                <a href="dieta.html" class="list-group-item list-group-item-action"><i class="fas fa-apple-alt me-3"></i>Plano Alimentar</a>
            </div>

            <div class="list-group list-group-flush mb-4 mt-auto">
                <a href="#" id="btnSair" class="list-group-item list-group-item-action text-danger fw-bold">
                    <i class="fas fa-sign-out-alt me-3"></i>Sair do Sistema
                </a>
            </div>
        </aside>

        <main id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3" id="menu-toggle" role="button"></i>
                    <h2 class="fs-3 m-0 fw-bold title-text">Montagem da Dieta</h2>
                </div>
            </nav>

            <section class="container-fluid px-4 py-3">
                <div class="card card-custom border-0 p-3 mb-4 bg-white shadow-sm">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <div>
                            <h5 class="mb-0 text-dark fw-bold">Paciente Selecionado: <span id="nomePacienteAtivo" class="text-success">Nenhum selecionado</span></h5>
                            <small id="objetivoPacienteAtivo" class="text-muted">Selecione um paciente para iniciar o planejamento.</small>
                        </div>
                        <button class="btn btn-outline-success btn-sm mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#modalPacientes">
                            <i class="fas fa-exchange-alt me-1"></i> Selecionar / Trocar Paciente
                        </button>
                    </div>
                </div>

                <div id="refeicoes-container"></div>

                <div class="d-flex justify-content-between mb-5 mt-4 flex-wrap gap-2">
                    <button id="btnNovaRefeicao" class="btn btn-outline-secondary fw-bold rounded-pill px-4 bg-white shadow-sm">
                        <i class="fas fa-plus-circle me-2"></i>Nova Refeição
                    </button>
                    <button id="btnSalvarDieta" class="btn btn-success fw-bold rounded-pill px-4 shadow-sm" style="background-color: var(--mint-green); border:none;" disabled>
                        <i class="fas fa-save me-2"></i>Guardar Plano Alimentar
                    </button>
                    <button id="btnGerarPDF" class="btn btn-dark fw-bold rounded-pill px-4 shadow-sm" style="background-color: var(--dark-green);">
                        <i class="fas fa-file-pdf me-2"></i>Gerar Plano em PDF
                    </button>
                </div>
            </section>
        </main>
    </div>

    <div class="modal fade" id="modalPacientes" tabindex="-1" aria-labelledby="modalPacientesLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="modalPacientesLabel"><i class="fas fa-users text-success me-2"></i>Prontuários Clínicos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="selectModalPaciente" class="form-label fw-semibold">Escolha o paciente para carregar/editar o plano:</label>
                    <select id="selectModalPaciente" class="form-select border-secondary">
                        <option value="" selected disabled>Carregando pacientes...</option>
                    </select>
                    <div id="alertaErroPacientes" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-modal="modal" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarPaciente" class="btn btn-success rounded-pill px-4">Confirmar e Carregar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    
    <script>
                    // ==========================================
            // GUARDA DE ROTA (Proteção da Página)
            // ==========================================
            const tokenAuth = auth.token();
            const roleAuth = auth.role();
            auth.exigir('profissional');
            // ==========================================
        document.addEventListener("DOMContentLoaded", async function() {
            const el = document.getElementById("wrapper");
            const toggleButton = document.getElementById("menu-toggle");
            toggleButton.addEventListener("click", () => el.classList.toggle("toggled"));

            let baseTACO = [];
            let listaPacientes = [];
            let pacienteIdAtivo = null;
            let contadorID = 0;
            let dieta = [];

            const containerRefeicoes = document.getElementById('refeicoes-container');
            const btnNovaRefeicao = document.getElementById('btnNovaRefeicao');
            const btnSalvarDieta = document.getElementById('btnSalvarDieta');
            const selectModal = document.getElementById('selectModalPaciente');
            const alertaErroPacientes = document.getElementById('alertaErroPacientes');

            // ──────────────────────────────────────────────────────────────
            // Helper: busca autenticada com verificação de status.
            // Nunca falha silenciosamente — sempre lança um erro descritivo.
            // ──────────────────────────────────────────────────────────────
            async function fetchAutenticado(url) {
                const resposta = await fetch(url, {
                    headers: { "Authorization": `Bearer ${auth.token()}` }
                });
                if (resposta.status === 401) throw new Error("SESSAO_EXPIRADA");
                if (!resposta.ok) throw new Error(`Servidor respondeu ${resposta.status} para ${url}`);
                return resposta.json();
            }

            function mostrarErroPacientes(mensagem) {
                alertaErroPacientes.textContent = mensagem;
                alertaErroPacientes.style.display = 'block';
                selectModal.innerHTML = '<option value="" selected disabled>Não foi possível carregar</option>';
            }

            // ──────────────────────────────────────────────────────────────
            // CORREÇÃO PRINCIPAL:
            // As duas requisições (alimentos e pacientes) agora rodam de
            // forma INDEPENDENTE, cada uma com seu próprio try/catch.
            // Antes, estavam sequenciais dentro do mesmo bloco — se
            // /alimentos/ (tabela TACO inteira) falhasse ou demorasse,
            // /pacientes/ nunca chegava a ser chamada, e o erro era
            // engolido silenciosamente pelo catch genérico. Por isso o
            // select ficava travado em "Carregando pacientes..." pra sempre.
            // ──────────────────────────────────────────────────────────────
            async function inicializarDados() {
                try {
                    baseTACO = await fetchAutenticado(`${API_BASE}/alimentos/`);
                } catch (e) {
                    console.error("Erro ao carregar alimentos (TACO):", e.message);
                }

                try {
                    listaPacientes = await fetchAutenticado(`${API_BASE}/pacientes/`);

                    if (listaPacientes.length === 0) {
                        selectModal.innerHTML = '<option value="" selected disabled>Nenhum paciente cadastrado</option>';
                        return;
                    }

                    selectModal.innerHTML = '<option value="" selected disabled>Selecione um paciente...</option>';
                    listaPacientes.forEach(p => {
                        selectModal.innerHTML += `<option value="${p.id}">${p.nome} (${p.objetivo || 'sem objetivo'})</option>`;
                    });

                } catch (e) {
                    console.error("Erro ao carregar pacientes:", e.message);
                    if (e.message === "SESSAO_EXPIRADA") {
                        mostrarErroPacientes("Sua sessão expirou. Faça login novamente.");
                        setTimeout(() => { auth.limpar(); window.location.href = "login.html"; }, 2500);
                    } else {
                        mostrarErroPacientes(
                            `Não foi possível carregar os pacientes. (${e.message}) ` +
                            `Verifique se o backend está rodando e se a URL em config.js está correta.`
                        );
                    }
                }
            }

            async function carregarDietaDoPaciente(id) {
                pacienteIdAtivo = id;
                const p = listaPacientes.find(pac => pac.id === id);
                document.getElementById('nomePacienteAtivo').textContent = p.nome;
                document.getElementById('objetivoPacienteAtivo').textContent = `Objetivo Atual: ${p.objetivo}`;
                btnSalvarDieta.disabled = false;

                try {
                    const dadosDietaDB = await fetchAutenticado(`${API_BASE}/dietas/${id}`);

                    if (dadosDietaDB.length > 0) {
                        contadorID = 0;
                        dieta = dadosDietaDB.map(ref => {
                            contadorID++;
                            return {
                                id: contadorID, nome: ref.nome, horario: ref.horario,
                                itens: ref.itens.map(item => {
                                    const fator = item.quantidade / 100;
                                    return {
                                        id: item.id, nome: item.nome, quantidade: item.quantidade,
                                        calcKcal: item.kcal_base * fator,
                                        calcCarb: item.carb_base * fator,
                                        calcProt: item.prot_base * fator,
                                        calcGord: item.gord_base * fator,
                                        calcFibra: (item.fibra_base || 0) * fator,
                                        calcSodio: (item.sodio_base || 0) * fator
                                    };
                                })
                            };
                        });
                    } else {
                        contadorID = 1;
                        dieta = [{ id: 1, nome: "Café da Manhã", horario: "08:00", itens: [] }];
                    }
                    renderizarDieta();
                } catch (e) {
                    console.error("Erro ao carregar dieta do paciente:", e.message);
                    alert(`Erro ao carregar o plano alimentar deste paciente: ${e.message}`);
                }
            }

            document.getElementById('btnConfirmarPaciente').addEventListener('click', function() {
                const id = parseInt(selectModal.value);
                if (!id) return alert("Selecione um paciente.");
                carregarDietaDoPaciente(id);
                bootstrap.Modal.getInstance(document.getElementById('modalPacientes')).hide();
            });

            window.renderizarDieta = function() {
                containerRefeicoes.innerHTML = '';
                if (!pacienteIdAtivo) {
                    containerRefeicoes.innerHTML = '<div class="alert alert-info text-center py-4 fw-semibold"><i class="fas fa-arrow-up me-2"></i> Carregue o prontuário de um paciente para iniciar.</div>';
                    return;
                }

                dieta.forEach((refeicao) => {
                    let htmlItens = '';
                    let totKcal = 0, totCarb = 0, totProt = 0, totGord = 0, totFibra = 0, totSodio = 0;

                    if (refeicao.itens.length > 0) {
                        refeicao.itens.forEach((item, indexItem) => {
                            totKcal += item.calcKcal; totCarb += item.calcCarb;
                            totProt += item.calcProt; totGord += item.calcGord;
                            totFibra += item.calcFibra; totSodio += item.calcSodio;

                            htmlItens += `
                                <tr>
                                    <td class="fw-semibold text-dark">${item.nome}</td>
                                    <td>${item.quantidade}</td>
                                    <td>${item.calcKcal.toFixed(1)}</td>
                                    <td>${item.calcCarb.toFixed(1)}</td>
                                    <td>${item.calcProt.toFixed(1)}</td>
                                    <td>${item.calcGord.toFixed(1)}</td>
                                    <td class="text-success">${item.calcFibra.toFixed(1)}</td>
                                    <td class="text-danger">${item.calcSodio.toFixed(1)}</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-danger" onclick="removerAlimento(${refeicao.id}, ${indexItem})"><i class="fas fa-trash-alt"></i></button>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        htmlItens = `<tr><td colspan="9" class="text-center text-muted py-4"><i class="fas fa-utensils fs-3 mb-2 opacity-50 d-block"></i>Nenhum alimento adicionado.</td></tr>`;
                    }

                    let optionsTACO = '<option value="" selected disabled>Selecione um alimento...</option>';
                    if (baseTACO.length === 0) {
                        optionsTACO = '<option value="" selected disabled>Tabela TACO indisponível — verifique o backend</option>';
                    } else {
                        baseTACO.forEach(a => { optionsTACO += `<option value="${a.id}">${a.nome}</option>`; });
                    }

                    const card = document.createElement('div');
                    card.className = 'card card-custom border-0 p-4 mb-4 shadow-sm';
                    card.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3 flex-wrap gap-2">
                            <div class="d-flex align-items-center gap-2">
                                <i class="fas fa-mug-hot text-warning fs-4"></i>
                                <input type="text" class="form-control fw-bold border-0 bg-light fs-5" value="${refeicao.nome}" onchange="atualizarNome(${refeicao.id}, this.value)" style="width: 250px;">
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <i class="far fa-clock text-muted"></i>
                                <input type="time" class="form-control border-secondary text-dark fw-bold" value="${refeicao.horario}" onchange="atualizarHorario(${refeicao.id}, this.value)">
                                <button class="btn btn-outline-danger ms-2" onclick="removerRefeicao(${refeicao.id})"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                        <div class="row g-3 align-items-end mb-4 bg-light p-3 rounded">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Buscar Alimento</label>
                                <select id="select-alimento-${refeicao.id}" class="form-select border-secondary">${optionsTACO}</select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Quantidade (g)</label>
                                <input type="number" id="qtd-alimento-${refeicao.id}" class="form-control border-secondary" min="1" placeholder="Ex: 100">
                            </div>
                            <div class="col-md-3">
                                <button onclick="adicionarAlimento(${refeicao.id})" class="btn btn-success w-100 fw-bold" style="background-color: var(--mint-green); border: none;"><i class="fas fa-plus me-2"></i>Adicionar</button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr><th>Alimento</th><th>Qtd (g)</th><th>Kcal</th><th>Carb (g)</th><th>Prot (g)</th><th>Gord (g)</th><th>Fibra (g)</th><th>Sódio (mg)</th><th>Ação</th></tr>
                                </thead>
                                <tbody>${htmlItens}</tbody>
                                <tfoot class="fw-bold bg-light" style="${refeicao.itens.length > 0 ? '' : 'display:none;'}">
                                    <tr>
                                        <td colspan="2" class="text-end">TOTAIS DA REFEIÇÃO:</td>
                                        <td class="text-primary fs-5">${totKcal.toFixed(1)}</td>
                                        <td>${totCarb.toFixed(1)}</td>
                                        <td>${totProt.toFixed(1)}</td>
                                        <td>${totGord.toFixed(1)}</td>
                                        <td class="text-success">${totFibra.toFixed(1)}</td>
                                        <td class="text-danger">${totSodio.toFixed(1)}</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    `;
                    containerRefeicoes.appendChild(card);
                });
            };

            window.adicionarAlimento = function(idRefeicao) {
                const select = document.getElementById(`select-alimento-${idRefeicao}`);
                const inputQtd = document.getElementById(`qtd-alimento-${idRefeicao}`);
                const idAlimento = parseInt(select.value);
                const qtd = parseFloat(inputQtd.value);

                if (isNaN(idAlimento) || isNaN(qtd) || qtd <= 0) return alert("Preencha o alimento e a quantidade.");

                const alimentoEncontrado = baseTACO.find(a => a.id === idAlimento);
                const fator = qtd / 100;

                const refeicao = dieta.find(r => r.id === idRefeicao);
                refeicao.itens.push({
                    id: alimentoEncontrado.id, nome: alimentoEncontrado.nome, quantidade: qtd,
                    calcKcal: alimentoEncontrado.kcal * fator,
                    calcCarb: alimentoEncontrado.carb * fator,
                    calcProt: alimentoEncontrado.prot * fator,
                    calcGord: alimentoEncontrado.gord * fator,
                    calcFibra: (alimentoEncontrado.fibra || 0) * fator,
                    calcSodio: (alimentoEncontrado.sodio || 0) * fator
                });
                renderizarDieta();
            };

            window.removerAlimento = function(idRefeicao, indexItem) { dieta.find(r => r.id === idRefeicao).itens.splice(indexItem, 1); renderizarDieta(); };
            window.atualizarNome = function(idRefeicao, novoNome) { dieta.find(r => r.id === idRefeicao).nome = novoNome; };
            window.atualizarHorario = function(idRefeicao, novoHorario) { dieta.find(r => r.id === idRefeicao).horario = novoHorario; };
            window.removerRefeicao = function(idRefeicao) {
                if(confirm("Deseja excluir esta refeição?")) { dieta = dieta.filter(r => r.id !== idRefeicao); renderizarDieta(); }
            };

            btnNovaRefeicao.addEventListener('click', function() {
                if(!pacienteIdAtivo) return alert("Selecione um paciente primeiro.");
                contadorID++;
                dieta.push({ id: contadorID, nome: `Nova Refeição ${contadorID}`, horario: "12:00", itens: [] });
                renderizarDieta();
            });

            btnSalvarDieta.addEventListener('click', async function() {
                const token = auth.token();
                if (!token) {
                    alert("Sua sessão expirou. Por favor, faça login novamente.");
                    window.location.href = "login.html";
                    return;
                }
                const payload = {
                    paciente_id: pacienteIdAtivo,
                    refeicoes: dieta.map(r => ({
                        nome: r.nome, horario: r.horario,
                        itens: r.itens.map(i => ({ id: i.id, quantidade: i.quantidade }))
                    }))
                };

                const textoOriginal = btnSalvarDieta.innerHTML;
                btnSalvarDieta.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Salvando Alterações...';
                btnSalvarDieta.disabled = true;

                try {
                    const resposta = await fetch(`${API_BASE}/dietas/`, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });
                    if (resposta.ok) alert("✅ Plano Alimentar atualizado com sucesso!");
                    else alert(`❌ Erro ao atualizar o plano (status ${resposta.status}).`);
                } catch (erro) {
                    alert("⚠️ Erro de conexão com o Back-End.");
                } 
                finally { btnSalvarDieta.innerHTML = textoOriginal; btnSalvarDieta.disabled = false; }
            });

            inicializarDados();
            renderizarDieta();

            // ==========================================
            // GERADOR DE PDF — window.open + CSS de impressão
            // ==========================================
            document.getElementById('btnGerarPDF').addEventListener('click', function() {
                if (!pacienteIdAtivo) return alert("Selecione um paciente para gerar o documento.");

                const p = listaPacientes.find(pac => pac.id === pacienteIdAtivo);
                if (!p) return alert("Dados do paciente não encontrados. Recarregue a página.");

                if (!dieta || dieta.length === 0) {
                    return alert("Este paciente ainda não possui refeições cadastradas no plano.");
                }

                let imc = "-", tmb = "-";
                if (p.peso && p.altura) {
                    imc = (p.peso / ((p.altura / 100) ** 2)).toFixed(1);
                }
                if (p.peso && p.altura && p.idade) {
                    const base = p.sexo === 'M'
                        ? 66.5 + (13.75 * p.peso) + (5.003 * p.altura) - (6.75 * p.idade)
                        : 655.1 + (9.563 * p.peso) + (1.85 * p.altura) - (4.676 * p.idade);
                    tmb = Math.round(base) + " kcal/dia";
                }
                const dataAtual = new Date().toLocaleDateString('pt-BR');

                let blocoRefeicoes = '';
                dieta.forEach(ref => {
                    let tKcal=0, tCarb=0, tProt=0, tGord=0, tFibra=0, tSodio=0;
                    let linhas = '';

                    if (!ref.itens || ref.itens.length === 0) {
                        linhas = `<tr><td colspan="8" class="vazio">Nenhum alimento registrado.</td></tr>`;
                    } else {
                        ref.itens.forEach(item => {
                            tKcal  += item.calcKcal;
                            tCarb  += item.calcCarb;
                            tProt  += item.calcProt;
                            tGord  += item.calcGord;
                            tFibra += item.calcFibra;
                            tSodio += item.calcSodio;
                            linhas += `
                                <tr>
                                    <td class="col-nome">${item.nome}</td>
                                    <td class="num">${item.quantidade}</td>
                                    <td class="num">${item.calcKcal.toFixed(1)}</td>
                                    <td class="num">${item.calcCarb.toFixed(1)}</td>
                                    <td class="num">${item.calcProt.toFixed(1)}</td>
                                    <td class="num">${item.calcGord.toFixed(1)}</td>
                                    <td class="num verde">${item.calcFibra.toFixed(1)}</td>
                                    <td class="num vermelho">${item.calcSodio.toFixed(1)}</td>
                                </tr>`;
                        });
                    }

                    blocoRefeicoes += `
                        <div class="refeicao">
                            <div class="refeicao-titulo">${ref.horario} — ${ref.nome}</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th class="col-nome">Alimento</th>
                                        <th class="num">Qtd (g)</th>
                                        <th class="num">Kcal</th>
                                        <th class="num">Carb</th>
                                        <th class="num">Prot</th>
                                        <th class="num">Gord</th>
                                        <th class="num verde">Fibra</th>
                                        <th class="num vermelho">Sódio</th>
                                    </tr>
                                </thead>
                                <tbody>${linhas}</tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="2" class="total-label">Totais da Refeição:</td>
                                        <td class="num">${tKcal.toFixed(1)}</td>
                                        <td class="num">${tCarb.toFixed(1)}</td>
                                        <td class="num">${tProt.toFixed(1)}</td>
                                        <td class="num">${tGord.toFixed(1)}</td>
                                        <td class="num verde">${tFibra.toFixed(1)}</td>
                                        <td class="num vermelho">${tSodio.toFixed(1)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>`;
                });

                const htmlImpressao = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Plano Alimentar — ${p.nome}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11pt;
            color: #222;
            background: #fff;
            padding: 20mm 15mm;
        }
        .cabecalho {
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .cabecalho-icone { font-size: 32pt; }
        .cabecalho h1 {
            font-size: 14pt;
            color: #28a745;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .cabecalho p { font-size: 9pt; color: #666; }
        .paciente-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }
        .paciente-box h2 {
            font-size: 10pt;
            color: #555;
            text-transform: uppercase;
            letter-spacing: .04em;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }
        .paciente-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 20px;
            font-size: 10pt;
            line-height: 1.7;
        }
        .paciente-grid b { color: #444; }
        .prescricao-titulo {
            font-size: 11pt;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #28a745;
            padding-bottom: 4px;
            margin-bottom: 14px;
        }
        .refeicao {
            margin-bottom: 16px;
            page-break-inside: avoid;
        }
        .refeicao-titulo {
            background: #28a745;
            color: #fff;
            font-size: 10pt;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
        }
        thead tr { background: #eeeeee; border-bottom: 2px solid #ccc; }
        th { padding: 5px 6px; font-weight: bold; color: #444; }
        td { padding: 4px 6px; border-bottom: 1px solid #f0f0f0; }
        tfoot tr { background: #f8f9fa; border-top: 2px solid #ddd; font-weight: bold; }
        .col-nome { text-align: left; }
        th.col-nome { text-align: left; }
        .num { text-align: right; }
        .total-label { text-align: right; padding-right: 8px; }
        .verde  { color: #1e7e34; }
        .vermelho { color: #c82333; }
        .vazio  { text-align: center; color: #999; padding: 8px; }
        .assinaturas {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            text-align: center;
            font-size: 10pt;
        }
        .assinatura { width: 44%; }
        .assinatura hr { border: 1px solid #555; margin-bottom: 4px; }
        .rodape {
            margin-top: 24px;
            text-align: center;
            font-size: 8pt;
            color: #aaa;
        }
        @media print {
            body { padding: 0; }
            .refeicao-titulo,
            .paciente-box,
            thead tr {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body>

    <div class="cabecalho">
        <div class="cabecalho-icone">🥗</div>
        <div>
            <h1>Prontuário e Plano Alimentar</h1>
            <p>NutriSocial — Acompanhamento Clínico Individualizado</p>
            <p style="font-size:8pt;color:#999;margin-top:2px;">Data de Emissão: ${dataAtual}</p>
        </div>
    </div>

    <div class="paciente-box">
        <h2>Identificação do Paciente</h2>
        <div class="paciente-grid">
            <div><b>Nome:</b> ${p.nome}</div>
            <div><b>Idade / Sexo:</b> ${p.idade || '-'} anos / ${p.sexo === 'M' ? 'Masculino' : 'Feminino'}</div>
            <div><b>Peso Atual:</b> ${p.peso || '-'} kg</div>
            <div><b>Altura:</b> ${p.altura || '-'} cm</div>
            <div><b>IMC:</b> ${imc}</div>
            <div><b>Taxa Metabólica Basal:</b> ${tmb}</div>
            <div style="grid-column:1/-1"><b>Objetivo Clínico:</b> ${p.objetivo || '-'}</div>
        </div>
    </div>

    <div class="prescricao-titulo">Prescrição Dietética</div>

    ${blocoRefeicoes}

    <div class="assinaturas">
        <div class="assinatura">
            <hr>
            <b>${p.nome}</b><br>
            <span style="color:#666">Assinatura do Paciente</span>
        </div>
        <div class="assinatura">
            <hr>
            <b>Nutricionista Responsável</b><br>
            <span style="color:#666">CRN: _________</span>
        </div>
    </div>

    <div class="rodape">
        Documento gerado eletronicamente pelo sistema NutriSocial.
    </div>

    <script>
        window.onload = function() { window.print(); };
    <\/script>
</body>
