<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSocial | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg-app: #f4f7f6;
            --bg-surface: #ffffff;
            --text-primary: #333333;
            --text-secondary: #6c757d;
            --border-color: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --input-border: #ced4da;
        }
        [data-theme="dark"] {
            --bg-app: #12181b;
            --bg-surface: #1b2327;
            --text-primary: #e8eaed;
            --text-secondary: #9aa4a8;
            --border-color: rgba(255,255,255,0.08);
            --input-bg: #222c30;
            --input-border: #384347;
        }
        body {
            background-color: var(--bg-app);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color .25s ease;
        }
        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: var(--bg-surface);
            color: var(--text-primary);
            position: relative;
            transition: background-color .25s ease, color .25s ease;
        }
        .btn-success { background-color: #2cba92; border: none; }
        .btn-success:hover { background-color: #249e7c; }
        .form-control {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
        }
        .form-control:focus { background-color: var(--input-bg); color: var(--text-primary); }
        .theme-toggle-login {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .theme-toggle-login:hover { color: #20c997; }

        /* ══════════════════════════════════════════════════════════
           LOADING: overlay de redirecionamento pós-login bem-sucedido
           ══════════════════════════════════════════════════════════ */
        .overlay-redirecionamento {
            position: fixed;
            inset: 0;
            background: var(--bg-app);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 9999;
            transition: opacity .2s ease;
        }
        .overlay-redirecionamento.ativo { display: flex; }
        .overlay-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border-color);
            border-top-color: #20c997;
            border-radius: 50%;
            animation: girar .7s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        .overlay-texto {
            color: var(--text-secondary);
            font-size: .95rem;
            text-align: center;
            max-width: 280px;
        }

        /* Mensagem progressiva de "servidor iniciando" dentro do card */
        #mensagemColdStart {
            display: none;
            font-size: .8rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
        }
        #mensagemColdStart.visivel { display: block; }

        /* Spinner inline no botão, reaproveitável em qualquer form */
        .spinner-btn {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.5);
            border-top-color: #fff;
            border-radius: 50%;
            animation: girar .6s linear infinite;
            margin-right: 8px;
            vertical-align: -2px;
        }
    </style>
</head>
<body>

    <!-- ══════════════════════════════════════════════════════════
         OVERLAY DE TRANSIÇÃO — aparece após login bem-sucedido,
         cobrindo o "salto" até o dashboard terminar de carregar.
         ══════════════════════════════════════════════════════════ -->
    <div class="overlay-redirecionamento" id="overlayRedirecionamento">
        <div class="overlay-spinner"></div>
        <div class="overlay-texto">Entrando no NutriSocial…</div>
    </div>

    <div class="card-login" id="cardLogin">
        <button class="theme-toggle-login" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">
            <i class="fas fa-moon"></i>
        </button>

        <!-- ── VISÃO: LOGIN ── -->
        <div id="visaoLogin">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-success"><i class="fa-solid fa-leaf me-2"></i>NutriSocial</h3>
                <p class="text-muted">Acesse a plataforma clínica</p>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label fw-semibold">E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>
                <div class="mb-2">
                    <label class="form-label fw-semibold">Senha</label>
                    <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="text-end mb-4">
                    <a href="#" class="small text-muted" id="linkEsqueciSenha">Esqueci minha senha</a>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill" id="btnLogin">Entrar no Sistema</button>
                <div id="mensagemColdStart">
                    <i class="fas fa-clock me-1"></i>
                    O servidor está iniciando — isso pode levar até 1 minuto na primeira vez do dia.
                </div>
            </form>
        </div>

        <!-- ── VISÃO: ESQUECI MINHA SENHA (oculta por padrão) ── -->
        <div id="visaoEsqueciSenha" style="display:none;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-success"><i class="fas fa-key me-2"></i>Redefinir Senha</h3>
                <p class="text-muted small">Informe seu e-mail cadastrado. Enviaremos um link para você criar uma nova senha.</p>
            </div>

            <form id="formEsqueciSenha">
                <div class="mb-4">
                    <label class="form-label fw-semibold">E-mail</label>
                    <input type="email" id="emailReset" class="form-control" placeholder="exemplo@email.com" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill mb-2" id="btnEnviarReset">
                    Enviar link de redefinição
                </button>
                <button type="button" class="btn btn-link w-100 text-muted" id="btnVoltarLogin">
                    ← Voltar para o login
                </button>
            </form>

            <div id="mensagemReset" class="alert alert-success mt-3 text-center small" style="display:none;"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        // ── Alternância entre as duas visões do card ──
        const visaoLogin         = document.getElementById('visaoLogin');
        const visaoEsqueciSenha  = document.getElementById('visaoEsqueciSenha');
        const mensagemReset      = document.getElementById('mensagemReset');

        document.getElementById('linkEsqueciSenha').addEventListener('click', function(e) {
            e.preventDefault();
            visaoLogin.style.display = 'none';
            visaoEsqueciSenha.style.display = 'block';
            mensagemReset.style.display = 'none';
        });

        document.getElementById('btnVoltarLogin').addEventListener('click', function() {
            visaoEsqueciSenha.style.display = 'none';
            visaoLogin.style.display = 'block';
        });

        // ── Envio da solicitação de reset ──
        document.getElementById('formEsqueciSenha').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnEnviarReset');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            btn.disabled = true;

            try {
                const resposta = await fetch(`${API_BASE}/auth/esqueci-senha`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: document.getElementById('emailReset').value.trim() })
                });

                const resultado = await resposta.json();

                // A API sempre responde com sucesso genérico, exista ou não o
                // e-mail — isso é proposital (proteção contra enumeração).
                document.getElementById('formEsqueciSenha').style.display = 'none';
                mensagemReset.textContent = resultado.mensagem || "Se este e-mail estiver cadastrado, você receberá um link em instantes.";
                mensagemReset.style.display = 'block';

            } catch (erro) {
                alert("⚠️ Erro de conexão com o servidor. Tente novamente em instantes.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        });

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn                = document.getElementById('btnLogin');
            const mensagemColdStart  = document.getElementById('mensagemColdStart');
            const overlay            = document.getElementById('overlayRedirecionamento');
            const textoOriginalBtn   = btn.innerHTML;

            // ── Estado de carregamento: botão desabilitado + spinner ──
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-btn"></span>Entrando…';

            // Se a resposta demorar mais que 4s, é provável que o back-end
            // esteja "acordando" do repouso do plano gratuito (Render).
            // Avisamos o usuário para não parecer que a tela travou.
            const timeoutAvisoColdStart = setTimeout(() => {
                mensagemColdStart.classList.add('visivel');
                btn.innerHTML = '<span class="spinner-btn"></span>Aguardando o servidor…';
            }, 4000);

            // O FastAPI espera os dados de login no formato URL-Encoded (Form Data)
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('email').value);
            formData.append('password', document.getElementById('senha').value);

            try {
                const resposta = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                clearTimeout(timeoutAvisoColdStart);

                if (resposta.ok) {
                    const dadosAuth = await resposta.json();
                    auth.salvar(dadosAuth.access_token, dadosAuth.role, dadosAuth.nome);

                    if (dadosAuth.role === 'profissional') {
                        // ── Overlay de transição: cobre o salto até o dashboard,
                        // em vez da tela de login simplesmente "sumir" no vazio.
                        overlay.classList.add('ativo');
                        window.location.href = "index.html";
                    } else {
                        btn.disabled = false;
                        btn.innerHTML = textoOriginalBtn;
                        mensagemColdStart.classList.remove('visivel');
                        alert(`Olá ${dadosAuth.nome}! A área do paciente estará disponível em breve.`);
                    }
                } else {
                    btn.disabled = false;
                    btn.innerHTML = textoOriginalBtn;
                    mensagemColdStart.classList.remove('visivel');
                    alert("❌ Credenciais inválidas. Verifique seu e-mail e senha.");
                }
            } catch (erro) {
                clearTimeout(timeoutAvisoColdStart);
                btn.disabled = false;
                btn.innerHTML = textoOriginalBtn;
                mensagemColdStart.classList.remove('visivel');
                alert("⚠️ Erro de conexão com o servidor de autenticação.");
            }
        });
    </script>
</body>
</html>
