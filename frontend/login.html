<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSocial | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg-app: #f4f7f6;
            --bg-surface: #ffffff;
            --text-primary: #333333;
            --text-secondary: #6c757d;
            --border-color: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --input-border: #ced4da;
        }
        [data-theme="dark"] {
            --bg-app: #12181b;
            --bg-surface: #1b2327;
            --text-primary: #e8eaed;
            --text-secondary: #9aa4a8;
            --border-color: rgba(255,255,255,0.08);
            --input-bg: #222c30;
            --input-border: #384347;
        }
        body {
            background-color: var(--bg-app);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color .25s ease;
        }
        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: var(--bg-surface);
            color: var(--text-primary);
            position: relative;
            transition: background-color .25s ease, color .25s ease;
        }
        .btn-success { background-color: #2cba92; border: none; }
        .btn-success:hover { background-color: #249e7c; }
        .form-control {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
        }
        .form-control:focus { background-color: var(--input-bg); color: var(--text-primary); }
        .theme-toggle-login {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .theme-toggle-login:hover { color: #20c997; }
    </style>
</head>
<body>

    <div class="card-login">
        <button class="theme-toggle-login" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">
            <i class="fas fa-moon"></i>
        </button>

        <div class="text-center mb-4">
            <h3 class="fw-bold text-success"><i class="fa-solid fa-leaf me-2"></i>NutriSocial</h3>
            <p class="text-muted">Acesse a plataforma clínica</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-semibold">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="text-end mb-4">
                <a href="#" class="small text-muted" id="linkEsqueciSenha">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill">Entrar no Sistema</button>
        </form>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Recuperação de senha por e-mail: pendente de decisão do serviço
        // de envio (Resend/SendGrid/etc). Por ora, orienta o usuário a
        // contatar o administrador — evita um link morto sem explicação.
        document.getElementById('linkEsqueciSenha').addEventListener('click', function(e) {
            e.preventDefault();
            alert("A recuperação automática de senha por e-mail está sendo implementada.\nPor enquanto, entre em contato com o administrador do sistema.");
        });

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            // O FastAPI espera os dados de login no formato URL-Encoded (Form Data)
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('email').value);
            formData.append('password', document.getElementById('senha').value);

            try {
                const resposta = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (resposta.ok) {
                    const dadosAuth = await resposta.json();

                    // Salva a sessão via módulo central (sessionStorage, sem expor em texto puro)
                    auth.salvar(dadosAuth.access_token, dadosAuth.role, dadosAuth.nome);

                    if (dadosAuth.role === 'profissional') {
                        window.location.href = "index.html";
                    } else {
                        alert(`Olá ${dadosAuth.nome}! A área do paciente estará disponível em breve.`);
                    }
                } else {
                    alert("❌ Credenciais inválidas. Verifique seu e-mail e senha.");
                }
            } catch (erro) {
                alert("⚠️ Erro de conexão com o servidor de autenticação.");
            }
        });
    </script>
</body>
</html>
