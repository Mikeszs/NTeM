<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSocial | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: Arial, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; padding: 30px; background: white; }
        .btn-success { background-color: #2cba92; border: none; }
        .btn-success:hover { background-color: #249e7c; }
    </style>
</head>
<body>

    <div class="card-login">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-success"><i class="fa-solid fa-leaf me-2"></i>NutriSocial</h3>
            <p class="text-muted">Acesse a plataforma clínica</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-semibold">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill">Entrar no Sistema</button>
        </form>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            // O FastAPI espera os dados de login no formato URL-Encoded (Form Data)
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('email').value);
            formData.append('password', document.getElementById('senha').value);

            try {
                const resposta = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (resposta.ok) {
                    const dadosAuth = await resposta.json();

                    // Salva a sessão via módulo central (sessionStorage, sem expor em texto puro)
                    auth.salvar(dadosAuth.access_token, dadosAuth.role, dadosAuth.nome);

                    if (dadosAuth.role === 'profissional') {
                        window.location.href = "index.html";
                    } else {
                        alert(`Olá ${dadosAuth.nome}! A área do paciente estará disponível em breve.`);
                    }
                } else {
                    alert("❌ Credenciais inválidas. Verifique seu e-mail e senha.");
                }
            } catch (erro) {
                alert("⚠️ Erro de conexão com o servidor de autenticação.");
            }
        });
    </script>
</body>
</html>
