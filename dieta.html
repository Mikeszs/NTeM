<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSocial | Plano Alimentar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        
        <aside id="sidebar-wrapper" class="bg-white shadow-sm">
            <div class="sidebar-heading text-center py-4 border-bottom">
                <i class="fa-solid fa-leaf fs-3 me-2 logo-icon"></i>
                <span class="fs-4 fw-bold logo-text">NutriSocial</span>
            </div>
            
            <div class="list-group list-group-flush my-3">
                <a href="index.html" class="list-group-item list-group-item-action">
                    <i class="fas fa-chart-line me-3"></i>Dashboard
                </a>
                <a href="cadastro.html" class="list-group-item list-group-item-action">
                    <i class="fas fa-user-plus me-3"></i>Cadastro & Anamnese
                </a>
                <a href="antropometria.html" class="list-group-item list-group-item-action">
                    <i class="fas fa-weight me-3"></i>Antropometria
                </a>
                <a href="dieta.html" class="list-group-item list-group-item-action active">
                    <i class="fas fa-apple-alt me-3"></i>Plano Alimentar
                </a>
            </div>
        </aside>

        <main id="page-content-wrapper">
            
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3" id="menu-toggle" role="button" aria-label="Alternar Menu"></i>
                    <h2 class="fs-3 m-0 fw-bold title-text">Montagem da Dieta</h2>
                </div>
            </nav>

            <section class="container-fluid px-4 py-3">
                
                <div class="card card-custom border-0 p-3 mb-4 bg-white shadow-sm">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <div>
                            <h5 class="mb-0 text-dark fw-bold">Paciente Atual: <span class="text-success">Maria da Silva</span></h5>
                            <small class="text-muted">Objetivo: Reeducação Alimentar | TMB: 1450 kcal</small>
                        </div>
                        <button class="btn btn-outline-success btn-sm mt-2 mt-md-0">
                            <i class="fas fa-exchange-alt me-1"></i> Trocar Paciente
                        </button>
                    </div>
                </div>

                <div id="refeicoes-container"></div>

                <div class="d-flex justify-content-between mb-5 mt-4">
                    <button id="btnNovaRefeicao" class="btn btn-outline-secondary fw-bold rounded-pill px-4 bg-white shadow-sm">
                        <i class="fas fa-plus-circle me-2"></i>Nova Refeição
                    </button>
                    <button class="btn btn-dark fw-bold rounded-pill px-4 shadow-sm" style="background-color: var(--dark-green);">
                        <i class="fas fa-file-pdf me-2"></i>Gerar Plano em PDF
                    </button>
                </div>

            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lógica do Menu Lateral
            const el = document.getElementById("wrapper");
            const toggleButton = document.getElementById("menu-toggle");
            toggleButton.addEventListener("click", () => el.classList.toggle("toggled"));

            // SIMULAÇÃO DO BANCO DE DADOS TACO
            const baseTACO = [
                { id: 1, nome: "Arroz branco, cozido", kcal: 130, carb: 28.1, prot: 2.5, gord: 0.2 },
                { id: 2, nome: "Feijão carioca, cozido", kcal: 76, carb: 13.6, prot: 4.8, gord: 0.5 },
                { id: 3, nome: "Peito de frango, grelhado", kcal: 159, carb: 0, prot: 32.0, gord: 2.5 },
                { id: 4, nome: "Ovo de galinha, cozido", kcal: 155, carb: 1.1, prot: 13.3, gord: 10.6 },
                { id: 5, nome: "Banana prata, crua", kcal: 98, carb: 26.0, prot: 1.3, gord: 0.1 },
                { id: 6, nome: "Aveia em flocos", kcal: 394, carb: 66.6, prot: 13.9, gord: 8.5 },
                { id: 7, nome: "Pão de forma integral", kcal: 253, carb: 49.9, prot: 9.4, gord: 3.7 },
                { id: 8, nome: "Leite integral", kcal: 62, carb: 5.0, prot: 3.3, gord: 3.2 }
            ];

            // ESTADO GLOBAL DA DIETA
            let contadorID = 1;
            let dieta = [
                { id: 1, nome: "Café da Manhã", horario: "07:30", itens: [] }
            ];

            const containerRefeicoes = document.getElementById('refeicoes-container');
            const btnNovaRefeicao = document.getElementById('btnNovaRefeicao');

            // FUNÇÃO PRINCIPAL PARA DESENHAR AS REFEIÇÕES NA TELA
            window.renderizarDieta = function() {
                containerRefeicoes.innerHTML = '';

                dieta.forEach((refeicao) => {
                    let htmlItens = '';
                    let totKcal = 0, totCarb = 0, totProt = 0, totGord = 0;

                    // Constrói as linhas da tabela de alimentos
                    if (refeicao.itens.length > 0) {
                        refeicao.itens.forEach((item, indexItem) => {
                            totKcal += item.calcKcal;
                            totCarb += item.calcCarb;
                            totProt += item.calcProt;
                            totGord += item.calcGord;

                            htmlItens += `
                                <tr>
                                    <td class="fw-semibold text-dark">${item.nome}</td>
                                    <td>${item.quantidade}</td>
                                    <td>${item.calcKcal.toFixed(1)}</td>
                                    <td>${item.calcCarb.toFixed(1)}</td>
                                    <td>${item.calcProt.toFixed(1)}</td>
                                    <td>${item.calcGord.toFixed(1)}</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-danger" onclick="removerAlimento(${refeicao.id}, ${indexItem})">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        htmlItens = `<tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-utensils fs-3 mb-2 opacity-50 d-block"></i>Nenhum alimento adicionado.</td></tr>`;
                    }

                    // Prepara as opções do Select
                    let optionsTACO = '<option value="" selected disabled>Selecione um alimento...</option>';
                    baseTACO.forEach(a => {
                        optionsTACO += `<option value="${a.id}">${a.nome}</option>`;
                    });

                    // Cria o card da Refeição
                    const card = document.createElement('div');
                    card.className = 'card card-custom border-0 p-4 mb-4 shadow-sm';
                    card.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3 flex-wrap gap-2">
                            <div class="d-flex align-items-center gap-2">
                                <i class="fas fa-mug-hot text-warning fs-4"></i>
                                <input type="text" class="form-control fw-bold border-0 bg-light fs-5" value="${refeicao.nome}" onchange="atualizarNome(${refeicao.id}, this.value)" style="width: 250px;">
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <i class="far fa-clock text-muted"></i>
                                <input type="time" class="form-control border-secondary text-dark fw-bold" value="${refeicao.horario}" onchange="atualizarHorario(${refeicao.id}, this.value)">
                                <button class="btn btn-outline-danger ms-2" onclick="removerRefeicao(${refeicao.id})" title="Excluir Refeição inteira">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end mb-4 bg-light p-3 rounded">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Buscar Alimento</label>
                                <select id="select-alimento-${refeicao.id}" class="form-select border-secondary">
                                    ${optionsTACO}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Quantidade (g)</label>
                                <input type="number" id="qtd-alimento-${refeicao.id}" class="form-control border-secondary" min="1" placeholder="Ex: 100">
                            </div>
                            <div class="col-md-3">
                                <button onclick="adicionarAlimento(${refeicao.id})" class="btn btn-success w-100 fw-bold" style="background-color: var(--mint-green); border: none;">
                                    <i class="fas fa-plus me-2"></i>Adicionar
                                </button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Alimento</th>
                                        <th>Qtd (g)</th>
                                        <th>Kcal</th>
                                        <th>Carb (g)</th>
                                        <th>Prot (g)</th>
                                        <th>Gord (g)</th>
                                        <th>Ação</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${htmlItens}
                                </tbody>
                                <tfoot class="fw-bold bg-light" style="${refeicao.itens.length > 0 ? '' : 'display:none;'}">
                                    <tr>
                                        <td colspan="2" class="text-end">TOTAIS DA REFEIÇÃO:</td>
                                        <td class="text-primary fs-5">${totKcal.toFixed(1)}</td>
                                        <td>${totCarb.toFixed(1)}</td>
                                        <td>${totProt.toFixed(1)}</td>
                                        <td>${totGord.toFixed(1)}</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    `;
                    containerRefeicoes.appendChild(card);
                });
            };

            // FUNÇÕES DE MANIPULAÇÃO DE DADOS
            window.adicionarAlimento = function(idRefeicao) {
                const select = document.getElementById(`select-alimento-${idRefeicao}`);
                const inputQtd = document.getElementById(`qtd-alimento-${idRefeicao}`);
                const idAlimento = parseInt(select.value);
                const qtd = parseFloat(inputQtd.value);

                if (isNaN(idAlimento) || isNaN(qtd) || qtd <= 0) {
                    alert("Selecione um alimento e informe uma quantidade válida.");
                    return;
                }

                const alimentoEncontrado = baseTACO.find(a => a.id === idAlimento);
                const fator = qtd / 100;

                const refeicao = dieta.find(r => r.id === idRefeicao);
                refeicao.itens.push({
                    id: alimentoEncontrado.id,
                    nome: alimentoEncontrado.nome,
                    quantidade: qtd,
                    calcKcal: alimentoEncontrado.kcal * fator,
                    calcCarb: alimentoEncontrado.carb * fator,
                    calcProt: alimentoEncontrado.prot * fator,
                    calcGord: alimentoEncontrado.gord * fator
                });

                renderizarDieta(); // Recarrega a tela com os novos dados
            };

            window.removerAlimento = function(idRefeicao, indexItem) {
                const refeicao = dieta.find(r => r.id === idRefeicao);
                refeicao.itens.splice(indexItem, 1);
                renderizarDieta();
            };

            window.atualizarNome = function(idRefeicao, novoNome) {
                const refeicao = dieta.find(r => r.id === idRefeicao);
                refeicao.nome = novoNome;
            };

            window.atualizarHorario = function(idRefeicao, novoHorario) {
                const refeicao = dieta.find(r => r.id === idRefeicao);
                refeicao.horario = novoHorario;
            };

            window.removerRefeicao = function(idRefeicao) {
                if(confirm("Tem certeza que deseja excluir esta refeição inteira?")) {
                    dieta = dieta.filter(r => r.id !== idRefeicao);
                    renderizarDieta();
                }
            };

            // EVENTO DO BOTÃO "NOVA REFEIÇÃO"
            btnNovaRefeicao.addEventListener('click', function() {
                contadorID++;
                dieta.push({
                    id: contadorID,
                    nome: `Nova Refeição ${contadorID}`,
                    horario: "12:00",
                    itens: []
                });
                renderizarDieta();
            });

            // Inicializa a tela pela primeira vez
            renderizarDieta();
        });
    </script>
</body>
</html>
